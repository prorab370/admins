<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Engine Sim</title>
<style>
:root{--fg:#e8eaed;--panel:rgba(26,30,37,.82);--accent:#e8590c}
html,body{height:100%;margin:0;overflow:hidden;background:#14171c;color:var(--fg);font:13px system-ui,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--panel);backdrop-filter:blur(8px);border-radius:10px;padding:8px 12px}
button{font:inherit;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
button.alt{background:rgba(128,128,128,.35)}button.on{background:var(--accent)}
.bar{position:fixed;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#top{top:10px;left:10px;right:10px;justify-content:space-between;pointer-events:none}#top>*{pointer-events:auto}
#bot{bottom:10px;left:50%;transform:translateX(-50%);justify-content:center}
canvas.tach{position:fixed;left:12px;top:50%;transform:translateY(-50%);width:min(170px,34vw);height:min(170px,34vw);pointer-events:none}
.pedal{position:fixed;right:12px;top:50%;transform:translateY(-50%);width:76px;height:210px;border-radius:14px;background:var(--panel);overflow:hidden;touch-action:none;display:flex;align-items:flex-end;border:2px solid var(--accent)}
.pedal i{display:block;width:100%;background:var(--accent);opacity:.85}.pedal span{position:absolute;top:8px;width:100%;text-align:center;font-weight:600;pointer-events:none}
.pedal.c{right:104px;width:64px}.lvlw{display:inline-block;width:56px;height:8px;background:#333;border-radius:4px;overflow:hidden}#lvl{display:block;height:100%;width:0;background:#4cc38a}
#drv{bottom:62px;left:50%;transform:translateX(-50%);justify-content:center}#drv button{min-width:30px}
#stall{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);display:none;pointer-events:none;z-index:6}
#stall .card{pointer-events:auto;text-align:center;font-size:16px;padding:8px 14px;white-space:nowrap}
#stall small{display:block;font-size:11px;opacity:.75;margin-top:3px}
#stall button{font-size:12px;margin-top:6px;padding:5px 12px}
#load{position:fixed;inset:0;background:#14171c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .5s}
#barw{width:260px;height:6px;background:#333;border-radius:3px;overflow:hidden}#bar{height:100%;width:0;background:var(--accent)}
@media (max-width:700px){#top{gap:4px}.card{padding:6px 8px}}
#hint{position:fixed;left:12px;bottom:12px;max-width:230px;font-size:12px;line-height:1.5;opacity:.75;pointer-events:none;z-index:5}
#hint b{color:var(--accent)}
#hint .row{display:flex;gap:6px;margin:2px 0}
#hint kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:1px 5px;font:11px monospace;min-width:14px;text-align:center}
@media (max-width:700px){#hint{display:none}}
html,body{touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#speedo{left:min(190px,38vw);width:min(120px,24vw);height:min(120px,24vw)}
#graph{position:fixed;left:12px;top:64px;width:220px;height:90px;pointer-events:none;border-radius:10px;background:rgba(26,30,37,.82)}
#tachTurbo{left:auto;right:12px;top:auto;bottom:12px;width:min(130px,26vw);height:min(130px,26vw);transform:none}
#tachTemp{left:auto;right:12px;top:64px;bottom:auto;width:min(100px,20vw);height:min(100px,20vw);transform:none}
/* Телефон, альбомная ориентация (и любое окно ниже 520 px) */
@media (max-height:520px){
  body{font-size:11px}
  .card{padding:4px 8px;border-radius:8px}
  button{padding:5px 9px;font-size:11px;border-radius:6px}
  #top{top:max(4px,env(safe-area-inset-top));left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right))}
  #top small,#hint,#graph,.lvlw,#vol,#ldv{display:none}
  #dw input{width:64px}
  canvas.tach{width:84px;height:84px}
  #tach{left:max(6px,env(safe-area-inset-left));top:44px;transform:none}
  #speedo{left:max(6px,env(safe-area-inset-left));top:134px;width:72px;height:72px;transform:none}
  #tachTurbo{left:max(6px,env(safe-area-inset-left));right:auto;top:auto;bottom:6px;width:60px;height:60px}
  #tachTemp{right:max(6px,env(safe-area-inset-right));top:44px;width:60px;height:60px}
  .pedal{top:auto;bottom:6px;transform:none;height:124px;width:56px;right:max(6px,env(safe-area-inset-right))}
  .pedal.c{right:calc(max(6px,env(safe-area-inset-right)) + 64px);width:48px}
  #bot,#drv{left:100px;right:150px;transform:none;justify-content:center}
  #bot{bottom:4px}#drv{bottom:42px}
  #stall{bottom:96px}#stall .card{font-size:14px}
}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="bar" id="top">
  <div class="card"><b>Engine Sim</b> · <span id="fps">–</span><br><small id="st"></small></div>
  <div class="bar card">
    <button class="alt" id="xr" title="X">X-ray</button>
    <label id="dw" style="display:none">Глубина реза <input id="depth" type="range" min="0" max="100" value="50"> <b id="dv">50%</b></label>
    <button class="alt" id="q" title="Q">Графика</button>
    <button class="alt" id="vw" title="Вид: мотор / трансмиссия / всё">Вид: мотор</button><button class="alt" id="reset">Камера</button>
  </div>
</div>
<canvas class="tach" id="tach"></canvas>
<canvas class="tach" id="speedo"></canvas>
<canvas id="graph"></canvas>
<canvas class="tach" id="tachTemp"></canvas>
<canvas class="tach" id="tachTurbo"></canvas>
<div class="pedal" id="pedal" title="Тяни вверх / Пробел"><span>ГАЗ</span><i id="pfill" style="height:0"></i></div>
<div class="bar card" id="bot">
  <button id="pause">Пауза</button><span id="ts" style="display:flex;gap:4px"></span><span>Обороты: <b id="rpmv">800</b></span><button class="alt" id="mute" title="M">🔊 Звук</button><input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" style="width:70px" title="Громкость"><span class="lvlw"><i id="lvl"></i></span>
</div>
<div class="bar card" id="drv">
  <span id="gears" style="display:flex;gap:4px"></span>
  <span style="color:#e8590c">🌡 <b id="tempv">20</b>°C</span>
  <span>Передача <b id="gr">N</b> · <b id="spd">0</b> км/ч · Сцепление <b id="cev">100</b>%</span><span class="lvlw"><i id="cbar" style="background:#4a9eff"></i></span><b id="slip" style="color:#e03131;opacity:.15" title="проскальзывание сцепления">SLIP</b>
  <button class="alt" id="killb" title="K">Стоп</button><button class="alt" id="hb" title="H">Ручник</button><button class="alt" id="ldb">Нагрузка</button><input id="lds" type="range" min="0" max="100" value="50" style="width:90px"><b id="ldv">50%</b>
</div>
<div class="pedal c" id="clutch" title="Сцепление: тяни вверх (выжать) / Shift"><span>СЦЕП</span><i id="cfill" style="height:0"></i></div>
<div id="stall"><div class="card"><span id="stt">Двигатель заглох</span><small id="sts">выжми сцепление или поставь N, затем</small><button id="startb">Завести (E)</button></div></div>
<div id="load"><div id="lt">Загрузка модели…</div><div id="barw"><div id="bar"></div></div></div>
<div id="hint" class="card">
<div class="row"><kbd>Пробел</kbd><kbd>↑</kbd><span>— газ</span></div>
<div class="row"><kbd>Shift</kbd><span>— сцепление</span></div>
<div class="row"><kbd>1</kbd>–<kbd>5</kbd><span>— передача</span></div>
<div class="row"><kbd>N</kbd><span>— нейтраль</span> <kbd>R</kbd><span>— задний</span></div>
<div class="row"><kbd>H</kbd><span>— ручник</span></div>
<div class="row"><kbd>E</kbd><span>— завести</span> <kbd>K</kbd><span>— стоп</span></div>
<div class="row"><kbd>M</kbd><span>— звук</span> <kbd>X</kbd><span>— разрез</span></div>
</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}</script>
<script type="module" src="./src/app.js"></script>
</body></html>
